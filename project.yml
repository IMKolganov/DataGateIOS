# XcodeGen spec — the .xcodeproj is generated, not committed:
#   brew install xcodegen && xcodegen generate && pod install
# then open DataGateIOS.xcworkspace.
name: DataGateIOS
options:
  bundleIdPrefix: imkolganov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    DEVELOPMENT_TEAM: ""
targets:
  DataGateIOS:
    type: application
    platform: iOS
    sources:
      - path: DataGateIOS
        excludes:
          - Config.example.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: imkolganov.DataGateIOS
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DataGate
        CODE_SIGN_ENTITLEMENTS: DataGateIOS/DataGateIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: DataGateVPNExtension
        embed: true
  DataGateVPNExtension:
    type: app-extension
    platform: iOS
    dependencies:
      - sdk: NetworkExtension.framework
    sources:
      - path: DataGateVPNExtension
        excludes:
          - mbedtls-include/**
          - libs/**
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: imkolganov.DataGateIOS.VPNExtension
        INFOPLIST_FILE: DataGateVPNExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: DataGateVPNExtension/DataGateVPNExtension.entitlements
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - USE_ASIO
          - ASIO_STANDALONE
          - USE_MBEDTLS
          - FMT_HEADER_ONLY
          - "OPENVPN_VERSION=\\\"3.11.8_datagate_ios_$(MARKETING_VERSION)\\\""
        OTHER_CPLUSPLUSFLAGS:
          - $(inherited)
          - -include
          - fmt/format.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/native-openvpn3/openvpn3
          - $(SRCROOT)/native-openvpn3/openvpn3/client
          - $(SRCROOT)/DataGateVPNExtension
          - $(SRCROOT)/DataGateVPNExtension/mbedtls-include
          - $(SRCROOT)/build-libxray
          - /opt/homebrew/include
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/DataGateVPNExtension/libs
          - $(SRCROOT)/build-libxray
        OTHER_LDFLAGS:
          - $(inherited)
          - -lc++
          - -lmbedtls
          - -lmbedx509
          - -lmbedcrypto
          - -lXray
          - -lresolv
